[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Student Management System"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.8.0",
    "bcrypt==4.0.1",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "pandas>=2.2.1",
    "pytest>=8.1.1",
    "httpx>=0.27.0",
    "ruff>=0.3.3",
    "python-dotenv>=1.0.1",
    "email-validator>=2.1.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "B008",   # Do not perform function call `Depends` in argument defaults (FastAPI standard pattern)
    "F821",   # Undefined name (SQLAlchemy string forward references)
    "DTZ003", # utcnow used
    "DTZ011", # `datetime.date.today()` used
    "DTZ005", # `datetime.datetime.now()` without tz
    "DTZ007", # `datetime.datetime.strptime()` without %z
    "BLE001", # Do not catch blind exception
    "S105",   # Possible hardcoded password (test/seed data)
    "S106",   # Possible hardcoded password
    "S110",   # try-except-pass
    "S311",   # Standard pseudo-random number generator
    "E501",   # Line too long
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
